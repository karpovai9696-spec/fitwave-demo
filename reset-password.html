<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitWave — восстановление пароля</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="landing-2025">
<a class="skip-link" href="#main-content">К содержимому</a>
<header class="topnav">
  <a class="brand" href="index.html">FitWave<span>.</span></a>
  <nav>
    <a href="index.html">На главную</a>
    <a href="login.html?mode=login">Войти</a>
  </nav>
</header>
<main id="main-content">
  <section class="card">
    <h1>Новый пароль</h1>
    <form class="auth-form" id="reset-form">
      <label for="new-pass">Новый пароль (минимум 8 символов)</label>
      <input id="new-pass" type="password" autocomplete="new-password">
      <p><button class="button" type="submit">Сохранить пароль</button></p>
      <p class="auth-hint" id="msg" hidden></p>
    </form>
    <p><a href="login.html?mode=login">Вернуться ко входу</a></p>
  </section>
  <p class="disclaimer">
    FitWave не оказывает медицинских услуг (медицинское ограничение FW-IR-001).
  </p>
</main>
<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script>
(function () {
  var token = new URLSearchParams(location.search).get("token") || "";
  var form = document.getElementById("reset-form");
  var msg = document.getElementById("msg");
  if (!token) {
    msg.hidden = false;
    msg.textContent = "Ссылка без токена. Запросите восстановление заново.";
    form.hidden = true;
    return;
  }
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pass = document.getElementById("new-pass").value;
    if (pass.length < 8) {
      msg.hidden = false;
      msg.textContent = "Пароль — минимум 8 символов.";
      return;
    }
    msg.hidden = false;
    msg.textContent = "Сохраняем…";
    fetch((window.FITWAVE_API_BASE || "") + "/api/auth/password-reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, new_password: pass })
    }).then(function (r) { return r.json().then(function (d) {
      return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (res.ok && res.data && res.data.password_updated) {
          msg.textContent = "Пароль обновлён. Войдите с новым паролем.";
          setTimeout(function () { location.href = "login.html?mode=login"; }, 2500);
        } else {
          msg.textContent = "Не удалось сбросить пароль: ссылка недействительна или истекла.";
        }
      }).catch(function () {
        msg.textContent = "Нет связи с сервером. Попробуйте позже.";
      });
  });
})();
</script>
</body>
</html>
